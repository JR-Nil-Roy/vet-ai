[theme]
# ভেটেরিনারি ক্লিনিকের অনুভূতি — পরিচ্ছন্ন সাদা পটভূমি, নিরাময়-সবুজ (teal)
# accent। হালকা থিম মাঠে/রোদে ফোনে পড়তেও সুবিধা।
base = "light"
primaryColor = "#0d9488"
backgroundColor = "#f7fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false
